  <!-- D Bowl -->
  <path class="fg" d="M10.5 7 H17 C22.5 7 25 10.5 25 16 C25 21.5 22.5 25 17 25 H10.5 V21.5 H16.5 C19.5 21.5 21.2 19 21.2 16 C21.2 13 19.5 10.5 16.5 10.5 H10.5 Z" />
  
